# XcodeGen spec — run `make project` (or `xcodegen generate`) to produce Oware.xcodeproj.
# The .xcodeproj is NOT committed; this file is the source of truth.
name: Oware
options:
  bundleIdPrefix: com.richardforjoe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  OwareEngine:
    path: Packages/OwareEngine

targets:
  Oware:
    type: application
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: Oware/Sources
      - path: Oware/Resources
    dependencies:
      - package: OwareEngine
    info:
      path: Oware/Info.plist
      properties:
        CFBundleDisplayName: Oware
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.richardforjoe.oware
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.richardforjoe.oware"
        CODE_SIGN_IDENTITY: "Apple Distribution"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: ""
  OwareTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OwareTests]
    dependencies:
      - target: Oware
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""

  OwareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OwareUITests]
    dependencies:
      - target: Oware
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  Oware:
    build:
      targets:
        Oware: all
        OwareTests: [test]
        OwareUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets: [OwareTests, OwareUITests]
    archive:
      config: Release
