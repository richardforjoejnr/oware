name: Lelu Ludo CI

# Lelu Ludo's CI (apps/lelu-ludo, packages/LudoEngine).
#
# Shared templates + thin callers: the real steps live in reusable-swift-package.yml (and, once the
# app has screens, reusable-ios-app.yml), which every app's CI calls. This file only says what Lelu
# Ludo tests with them.
#
# What runs this workflow: changes to Lelu Ludo's app, LudoEngine, this file, or the shared
# templates it calls (a template change runs every app that calls it, which is intended: it
# affects them all). Changes to Lelu Oware or its workflows do not run it.
#
# The rules engine is pure Swift, so it is tested on Linux in Apple's Swift container: a tenth of
# the cost of a macOS runner on a private repository. The app job (macOS, simulator) is added in
# the stage that gives the app its screens (see apps/lelu-ludo/docs/GAME_PLAN.md); when it is, add
# .github/workflows/reusable-ios-app.yml to both `paths:` lists below.
on:
  pull_request:
    paths:
      - apps/lelu-ludo/**
      - packages/LudoEngine/**
      - .github/workflows/ludo-ci.yml
      - .github/workflows/reusable-swift-package.yml
  push:
    branches: [main]
    paths:
      - apps/lelu-ludo/**
      - packages/LudoEngine/**
      - .github/workflows/ludo-ci.yml
      - .github/workflows/reusable-swift-package.yml

permissions:
  contents: read

concurrency:
  group: ludo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: LudoEngine
    uses: ./.github/workflows/reusable-swift-package.yml
    with:
      package-path: packages/LudoEngine
      runner: linux

  # The app job, to add when the app has screens (artifact named apart from Oware's TestResults):
  #
  # app:
  #   name: iOS app
  #   uses: ./.github/workflows/reusable-ios-app.yml
  #   with:
  #     app-dir: apps/lelu-ludo
  #     project: LeluLudo.xcodeproj
  #     scheme: LeluLudo
  #     artifact-name: LudoTestResults
