name: Reusable - iOS app build and test

# Shared template: generate the Xcode project, build the app and run its tests on a simulator
# (unsigned), then upload the result bundle and its JSON summaries as an artifact. Called by each
# app's own CI workflow; it has no triggers of its own.
#
# Editing this file affects every app that calls it, so every caller lists it in its `paths:`
# filter and a change here legitimately runs all of them. Editing one app's caller runs only that
# app.
#
# The artifact is uploaded from inside this reusable workflow but belongs to the caller's run, so
# Lelu Oware's "CI" run still carries the `TestResults` artifact that pages.yml and
# scripts/build-reports.py download.
on:
  workflow_call:
    inputs:
      app-dir:
        description: App directory from the repository root (e.g. apps/lelu-oware)
        required: true
        type: string
      project:
        description: Xcode project generated by XcodeGen, relative to app-dir (e.g. Oware.xcodeproj)
        required: true
        type: string
      scheme:
        description: Scheme to build and test (e.g. Oware)
        required: true
        type: string
      artifact-name:
        description: Name of the uploaded test-results artifact
        required: false
        type: string
        default: TestResults

permissions:
  contents: read

jobs:
  app:
    name: build + test (simulator)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ${{ inputs.app-dir }}
    env:
      PROJECT: ${{ inputs.project }}
      SCHEME: ${{ inputs.scheme }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Install tools
        run: brew install xcodegen xcbeautify
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve Swift packages, retried (a clone can fail on a busy runner)
        run: |
          for attempt in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME" && exit 0
            echo "Package resolution attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          exit 1
      - name: Pick a simulator
        id: sim
        run: echo "name=$(../../scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"
      - name: Build & test (simulator, unsigned)
        env:
          SIM_NAME: ${{ steps.sim.outputs.name }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
      - name: Export test summary for the Pages report
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > test-summary.json || true
          xcrun xcresulttool get test-results tests --path TestResults.xcresult > test-tests.json || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ inputs.app-dir }}/TestResults.xcresult
            ${{ inputs.app-dir }}/test-summary.json
            ${{ inputs.app-dir }}/test-tests.json
          if-no-files-found: ignore
