name: TestFlight

# A merge to main that changes the app produces a signed build on TestFlight. Merges that only touch
# docs, the website, CI or scripts do not (run it by hand from the Actions tab if needed).
on:
  push:
    branches: [main]
    paths:
      - apps/lelu-oware/Oware/**
      - apps/lelu-oware/project.yml
      - apps/lelu-oware/fastlane/**
      - packages/*/Sources/**
      - packages/*/Package.swift
      - Gemfile
      - .github/workflows/testflight.yml
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  beta:
    name: Build & upload to TestFlight
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/lelu-oware
    environment: testflight
    # Skip gracefully until signing secrets are configured (see docs/PIPELINE.md).
    if: ${{ vars.SIGNING_READY == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install tools
        run: brew install xcodegen xcbeautify
      - name: Version for this beta (next release, from PR titles since the last one)
        run: |
          VERSION="$(python3 ../../scripts/next_version.py --build)"
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          { echo "CHANGELOG<<EOF_NOTES"; python3 ../../scripts/next_version.py --notes; echo "EOF_NOTES"; } >> "$GITHUB_ENV"
          echo "Beta of version $VERSION"
      - name: Upload to TestFlight
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: BUNDLE_GEMFILE=$GITHUB_WORKSPACE/Gemfile bundle exec fastlane ios beta
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Oware-ipa
          path: "apps/lelu-oware/*.ipa"
          if-no-files-found: ignore
