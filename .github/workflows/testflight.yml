name: TestFlight

# A merge to main that changes the app produces a signed build on TestFlight. Merges that only touch
# docs, the website, CI or scripts do not (run it by hand from the Actions tab if needed).
# Each uploaded build has a version of its own (scripts/next_version.py: 1.1.0, then 1.1.1 …) and is
# tagged build/<version> on the commit it was made from, the build number kept in the tag's message;
# releasing to the App Store means running App Store Release (Lelu Oware) from one of those tags.
on:
  push:
    branches: [main]
    paths:
      - apps/lelu-oware/Oware/**
      - apps/lelu-oware/project.yml
      - apps/lelu-oware/fastlane/**
      - packages/OwareEngine/Sources/**
      - packages/OwareEngine/Package.swift
      - packages/SupportKit/Sources/**
      - packages/SupportKit/Package.swift
      - Gemfile
      - .github/workflows/testflight.yml
  workflow_dispatch:
    inputs:
      test_features:
        description: "Test build: Settings gets switches for unfinished features (nearby play). Not tagged, so it can never be sent to the App Store."
        type: boolean
        default: false

permissions:
  contents: write   # to tag each uploaded build

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  beta:
    name: Build & upload to TestFlight
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/lelu-oware
    environment: testflight
    # Skip gracefully until signing secrets are configured (see docs/PIPELINE.md).
    if: ${{ vars.SIGNING_READY == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "27.0" }
      - name: SDK the App Store accepts
        run: ../../scripts/sdk_deadline.sh
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install tools
        run: brew install xcodegen xcbeautify
      - name: Version for this beta (next release, from PR titles since the last one)
        id: version
        run: |
          VERSION="$(python3 ../../scripts/next_version.py --build)"
          # Same filter as scripts/next_version.py: only vX.Y.Z tags count as releases.
          LAST="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ "v$VERSION" = "$LAST" ]; then
            # --build answers the released version only when nothing was merged since the tag
            # (e.g. a manual run on a released commit). Apple refuses builds for a released version.
            echo "::notice::Nothing new since $LAST, so there is nothing to build. Skipping the upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ inputs.test_features }}" = "true" ]; then
            echo "TEST_FEATURES=true" >> "$GITHUB_ENV"
            echo "::warning::Test build with test features (nearby play switch in Settings). It is not tagged and must not be submitted for review."
          fi
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          # Set here (not inside fastlane) so the build tag below names the same number.
          {
            echo "VERSION=$VERSION"
            echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)"
            echo "CHANGELOG<<EOF_NOTES"
            if [ "${{ inputs.test_features }}" = "true" ]; then
              echo "TEST BUILD from ${GITHUB_REF_NAME}: Settings ▸ Test features ▸ Nearby play shows Play nearby under More. Not for the App Store."
              echo
            fi
            python3 ../../scripts/next_version.py --notes; echo "EOF_NOTES"
          } >> "$GITHUB_ENV"
          echo "Beta of version $VERSION"
      - name: Upload to TestFlight
        if: steps.version.outputs.skip != 'true'
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: BUNDLE_GEMFILE=$GITHUB_WORKSPACE/Gemfile bundle exec fastlane ios beta
      - name: Tag the build (pick this tag in App Store Release (Lelu Oware) to ship it)
        # Test builds are not tagged, so App Store Release can never pick one.
        if: steps.version.outputs.skip != 'true' && inputs.test_features != true
        run: |
          TAG="build/$VERSION"
          # The build number goes in the tag's message: App Store Release reads it from there.
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a "$TAG" -m "build $BUILD_NUMBER" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "Tagged $TAG. To release it: Actions ▸ App Store Release (Lelu Oware) ▸ Run workflow ▸ Use workflow from ▸ Tags ▸ $TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload IPA artifact
        if: always() && steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Oware-ipa
          path: "apps/lelu-oware/*.ipa"
          if-no-files-found: ignore
