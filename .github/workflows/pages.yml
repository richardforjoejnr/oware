name: Site

# The public website on AWS (S3 + CloudFront, infra/site): privacy and support pages App Review
# links to, the What's new page from the GitHub Releases, and test reports from main's CI and E2E
# runs. The code repository is private; only this built site is public.
# AWS access works as in aws-cdk-boilerplate: secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
# Skipped until the repository variable SITE_ON_AWS is "true". SITE_DOMAIN (a variable) is the
# domain bought in Route 53; leave it unset to serve the site at its CloudFront address.
on:
  push:
    branches: [main]
    paths: [docs/**, infra/site/**, scripts/build-reports.py, scripts/build_release_notes.py, scripts/site_pretty_urls.py, .github/workflows/pages.yml]
  release:
    types: [published]
  workflow_run:
    workflows: [CI, "E2E (Maestro)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # to download the test artifacts

concurrency:
  group: site
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build & deploy the site
    if: vars.SITE_ON_AWS == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    environment:
      name: site
      url: ${{ steps.deploy.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4
      - name: What's new page from the GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 scripts/build_release_notes.py "$RUNNER_TEMP/releases.json" docs/lelu-oware/whats-new.md --app "Lelu Oware" --slug lelu-oware
      - name: Build the docs site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Take ownership of _site
        run: sudo chown -R "$(id -u):$(id -g)" _site
      - name: Download the latest main-branch test artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          for wf in "CI" "E2E (Maestro)"; do
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              echo "$wf → run $id"
              gh run download "$id" -R "$GITHUB_REPOSITORY" -D "artifacts/$(echo "$wf" | tr ' ()' '___')" || echo "no artifacts for $wf"
              echo "$id" >> artifacts/runs.txt
            fi
          done
      - name: Build the report pages
        run: |
          # The run link is for the owner (the repository is private); the report itself is public.
          run_id=$(tail -1 artifacts/runs.txt 2>/dev/null || echo "")
          url=""; [ -n "$run_id" ] && url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          python3 scripts/build-reports.py artifacts _site/reports/lelu-oware --app "Lelu Oware" --run-url "$url" --sha "$GITHUB_SHA"
      - name: Short URLs (/lelu-oware/privacy, as on GitHub Pages)
        run: python3 scripts/site_pretty_urls.py _site
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/site/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy
        id: deploy
        env:
          SITE_DIR: ${{ github.workspace }}/_site
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: infra/site/scripts/deploy.sh prod
