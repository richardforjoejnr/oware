name: Pages

# Publishes the docs/ site (app index, privacy, support, what's new) plus a test-report page per app.
# Runs when docs change on main, when a release is published (the App Store workflow also starts it
# by hand, because releases it creates with GITHUB_TOKEN fire no `release` event), and after CI / E2E
# finish on main. Runs of PRs from forks whose branch happens to be called main are ignored.
# Repository Settings ▸ Pages ▸ Source must be "GitHub Actions" for this workflow to deploy.
on:
  push:
    branches: [main]
    paths: [docs/**, scripts/build-reports.py, scripts/build_release_notes.py, .github/workflows/pages.yml]
  release:
    types: [published]
  workflow_run:
    workflows: [CI, "E2E (Maestro)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# GitHub's guidance for Pages: let an in-progress deployment finish; a newer run queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run's `branches: [main]` matches a fork PR's head branch named main too.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: What's new page from the GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 scripts/build_release_notes.py "$RUNNER_TEMP/releases.json" docs/lelu-oware/whats-new.md --app "Lelu Oware" --slug lelu-oware
      - name: Build the docs site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      # jekyll-build-pages runs in a Docker container as root, so _site comes out root-owned
      # and the report step below can't write into it. Hand it back to the runner user.
      - name: Take ownership of _site
        run: sudo chown -R "$(id -u):$(id -g)" _site
      - name: Download the latest main-branch test artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          for wf in "CI" "E2E (Maestro)"; do
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              echo "$wf → run $id"
              gh run download "$id" -R "$GITHUB_REPOSITORY" -D "artifacts/$(echo "$wf" | tr ' ()' '___')" || echo "no artifacts for $wf"
              echo "$id" >> artifacts/runs.txt
            fi
          done
          find artifacts -maxdepth 3 | head -50
      - name: Build the report pages
        run: |
          run_id=$(tail -1 artifacts/runs.txt 2>/dev/null || echo "")
          url=""; [ -n "$run_id" ] && url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          python3 scripts/build-reports.py artifacts _site/reports/lelu-oware --app "Lelu Oware" --run-url "$url" --sha "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
