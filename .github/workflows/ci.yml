name: CI

# Lelu Oware's CI (apps/lelu-oware, packages/OwareEngine, packages/SupportKit). The name stays "CI":
# the Site workflow (pages.yml) triggers on it and scripts/build-reports.py downloads its
# `TestResults` artifact by that name.
#
# Shared templates + thin callers: the real steps live in the reusable workflows
# reusable-swift-package.yml and reusable-ios-app.yml, which every app's CI calls. This file only
# says what Lelu Oware tests with them, plus its own App Store readiness job.
#
# What runs this workflow: changes to Lelu Oware's app, its packages, its docs, the scripts its jobs
# use (listed one by one, not scripts/**, so e.g. scripts/new-app.sh does not build Oware), the
# Gemfile, this file, or the shared templates it calls (a template change runs every app that
# calls it, which is intended: it affects them all). Lelu Ludo has ludo-ci.yml, the website's
# infrastructure site-ci.yml.
on:
  pull_request:
    paths:
      - apps/lelu-oware/**
      - packages/OwareEngine/**
      - packages/SupportKit/**
      - docs/lelu-oware/**
      - scripts/release_readiness.py
      - scripts/next_version.py
      - scripts/test_next_version.py
      - scripts/build_release_notes.py
      - scripts/test_build_release_notes.py
      - scripts/site_pretty_urls.py
      - scripts/test_site_pretty_urls.py
      - scripts/pick-simulator.sh
      - Gemfile
      - Gemfile.lock
      - .github/workflows/ci.yml
      - .github/workflows/reusable-swift-package.yml
      - .github/workflows/reusable-ios-app.yml
  push:
    branches: [main]
    paths:
      - apps/lelu-oware/**
      - packages/OwareEngine/**
      - packages/SupportKit/**
      - docs/lelu-oware/**
      - scripts/release_readiness.py
      - scripts/next_version.py
      - scripts/test_next_version.py
      - scripts/build_release_notes.py
      - scripts/test_build_release_notes.py
      - scripts/site_pretty_urls.py
      - scripts/test_site_pretty_urls.py
      - scripts/pick-simulator.sh
      - Gemfile
      - Gemfile.lock
      - .github/workflows/ci.yml
      - .github/workflows/reusable-swift-package.yml
      - .github/workflows/reusable-ios-app.yml

# Read-only: results go out as artifacts, not as checks or PR comments. Applies to the called
# reusable workflows too (they cannot elevate it).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/lelu-oware

jobs:
  readiness:
    name: App Store readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check privacy manifest, icon, public pages, release flags
        run: python3 scripts/release_readiness.py "$APP_DIR"
      - name: Test the version calculator
        working-directory: scripts
        run: python3 -m unittest test_next_version test_build_release_notes test_site_pretty_urls

  # Pure Swift: tested on Linux in the swift:6.0 container.
  oware-engine:
    name: OwareEngine
    uses: ./.github/workflows/reusable-swift-package.yml
    with:
      package-path: packages/OwareEngine
      runner: linux

  # Imports StoreKit and SwiftUI, so it needs macOS.
  support-kit:
    name: SupportKit
    uses: ./.github/workflows/reusable-swift-package.yml
    with:
      package-path: packages/SupportKit
      runner: macos
      parallel: false

  app:
    name: iOS app
    uses: ./.github/workflows/reusable-ios-app.yml
    with:
      app-dir: apps/lelu-oware
      project: Oware.xcodeproj
      scheme: Oware
      artifact-name: TestResults
