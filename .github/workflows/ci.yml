name: CI

# Monorepo: one CI workflow per app. This one covers apps/lelu-oware; copy it (with new job names
# and APP_DIR) when adding another app, and add its job names to the branch protection rules.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/lelu-oware

jobs:
  readiness:
    name: App Store readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check privacy manifest, icon, public pages, release flags
        run: python3 scripts/release_readiness.py "$APP_DIR"
      - name: Test the version calculator
        working-directory: scripts
        run: python3 -m unittest test_next_version

  engine:
    name: Engine (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Test OwareEngine
        working-directory: packages/OwareEngine
        run: swift test --parallel
      - name: Test SupportKit
        working-directory: packages/SupportKit
        run: swift test

  app:
    name: iOS app (build + test)
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/lelu-oware
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Install tools
        run: brew install xcodegen xcbeautify
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: echo "name=$(../../scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"
      - name: Build & test (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Oware.xcodeproj \
            -scheme Oware \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
      - name: Export test summary for the Pages report
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > test-summary.json || true
          xcrun xcresulttool get test-results tests --path TestResults.xcresult > test-tests.json || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            apps/lelu-oware/TestResults.xcresult
            apps/lelu-oware/test-summary.json
            apps/lelu-oware/test-tests.json
          if-no-files-found: ignore
