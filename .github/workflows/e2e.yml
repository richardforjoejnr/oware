name: E2E (Maestro)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    name: Maestro flows on simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Install tools
        run: |
          brew install xcodegen xcbeautify
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Generate project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: echo "name=$(scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"
      - name: Build app for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Oware.xcodeproj -scheme Oware -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Boot simulator and install app
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.name }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.name }}" -b
          xcrun simctl install booted build/Build/Products/Debug-iphonesimulator/Oware.app
      - name: Run Maestro flows
        run: maestro test --format junit --output maestro-report.xml .maestro
      - name: Upload Maestro report & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/.maestro/tests/**
          if-no-files-found: ignore
