name: TestFlight (Lelu Ludo)

# Lelu Ludo's twin of testflight.yml: a merge to main that changes Lelu Ludo produces a signed build on
# TestFlight. Same secrets, same SIGNING_READY switch and same build-number scheme as Lelu Oware.
# Each uploaded build has a version of its own and is tagged build/ludo-<version> on the commit it was
# made from, the build number kept in the tag's message. The "ludo-" prefix keeps these tags apart
# from Lelu Oware's build/<version> tags, so Oware's App Store Release (release-oware.yml) refuses a Ludo tag.
#
# Version: worked out by scripts/next_version.py from Lelu Ludo's Conventional Commit PR titles since
# its last release tag (ludo-vX.Y.Z, made by release-ludo.yml): feat → 1.1.0, fix → 1.0.1, "!" → 2.0.0;
# a version already built moves on to the next patch (1.1.1, 1.1.2 …).
# Nobody edits MARKETING_VERSION by hand; this workflow writes it into project.yml for the build.
on:
  push:
    branches: [main]
    paths:
      - apps/lelu-ludo/LeluLudo/**
      - apps/lelu-ludo/project.yml
      - apps/lelu-ludo/fastlane/**
      - packages/LudoEngine/Sources/**
      - packages/LudoEngine/Package.swift
      - Gemfile
      - .github/workflows/testflight-ludo.yml
  workflow_dispatch:

permissions:
  contents: write   # to tag each uploaded build

concurrency:
  group: testflight-ludo
  cancel-in-progress: false

jobs:
  # Nothing is uploaded that would fail App Review on the basics (shared with every app's CI).
  readiness:
    name: Lelu Ludo
    uses: ./.github/workflows/reusable-app-readiness.yml
    with:
      app-dir: apps/lelu-ludo

  beta:
    name: Build & upload Lelu Ludo to TestFlight
    needs: readiness
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/lelu-ludo
    environment: testflight
    # Skip gracefully until signing secrets are configured (see docs/PIPELINE.md).
    if: ${{ vars.SIGNING_READY == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "27.0" }
      - name: SDK the App Store accepts
        run: ../../scripts/sdk_deadline.sh
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install tools
        run: brew install xcodegen xcbeautify
      - name: Version for this beta (next release, from PR titles since the last one)
        id: version
        run: |
          VERSION="$(python3 ../../scripts/next_version.py --build)"
          LAST="$(python3 ../../scripts/next_version.py --last-release)"
          if [ "ludo-v$VERSION" = "$LAST" ]; then
            # --build answers the released version only when nothing was merged since the tag.
            # Apple refuses builds for a released version.
            echo "::notice::Nothing new since $LAST, so there is nothing to build. Skipping the upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          # Set here (not inside fastlane) so the build tag below names the same number.
          # Notes: Lelu Ludo's PR titles (next_version.py picks its paths from this folder).
          {
            echo "VERSION=$VERSION"
            echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)"
            echo "CHANGELOG<<EOF_NOTES"; python3 ../../scripts/next_version.py --notes; echo "EOF_NOTES"
          } >> "$GITHUB_ENV"
          echo "Beta of Lelu Ludo $VERSION (last release: ${LAST:-none})"
      - name: Upload to TestFlight
        if: steps.version.outputs.skip != 'true'
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: BUNDLE_GEMFILE=$GITHUB_WORKSPACE/Gemfile bundle exec fastlane ios beta
      - name: Tag the build (pick this tag in App Store Release (Lelu Ludo) to ship it)
        if: steps.version.outputs.skip != 'true'
        run: |
          TAG="build/ludo-$VERSION"
          # The build number goes in the tag's message: App Store Release reads it from there.
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a "$TAG" -m "build $BUILD_NUMBER" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "Uploaded Lelu Ludo $VERSION ($BUILD_NUMBER) to TestFlight; tagged $TAG." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload IPA artifact
        if: always() && steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LeluLudo-ipa
          path: "apps/lelu-ludo/*.ipa"
          if-no-files-found: ignore
