name: App Store Release

# Uploads a signed build to App Store Connect for the App Store (not just TestFlight).
#   - Publishing a GitHub Release tagged vX.Y.Z uses X.Y.Z as the app version.
#   - Or run it by hand: Actions ▸ App Store Release ▸ Run workflow, give the version and choose
#     whether to submit for review. The `production` environment can require your approval first.
#     Manual runs must use the main branch (they tag what they build).
# The App Store text, screenshots, privacy answers and age rating are filled in App Store Connect.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "App version, e.g. 1.2.0. Leave empty to use the next version from the PR titles since the last release"
        type: string
        required: false
      submit_for_review:
        description: "Also submit for App Review (otherwise the build waits in App Store Connect)"
        type: boolean
        default: false

run-name: ${{ github.event_name == 'release' && format('App Store {0}', github.ref_name) || format('App Store {0}{1}', inputs.version || 'project version', inputs.submit_for_review && ' + submit' || '') }}

permissions:
  contents: write   # to tag the release after a manual run
  actions: write    # to start the Pages workflow (a release made with GITHUB_TOKEN fires no `release` event)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & upload to App Store Connect
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/lelu-oware
    environment: production   # add required reviewers on this environment for a manual gate
    if: ${{ vars.SIGNING_READY == 'true' }}
    steps:
      - name: Manual releases only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run App Store Release from the main branch (got $GITHUB_REF). A manual run tags the commit it builds."
          exit 1
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install tools
        run: brew install xcodegen xcbeautify
      - name: Set the app version (from the tag or the manual input)
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then VERSION="$INPUT_VERSION"
          else VERSION="$(python3 ../../scripts/next_version.py)"; fi
          # Same filter as scripts/next_version.py: only vX.Y.Z tags count as releases.
          LAST="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ "$GITHUB_EVENT_NAME" != "release" ] && [ "v$VERSION" = "$LAST" ]; then
            echo "::error::Nothing new for players since $LAST (only docs/chore/ci/test/style PRs). No release made."
            exit 1
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Version must look like 1.2.0, got '$VERSION'"; exit 1; }
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App version: $VERSION"
      - name: App Store readiness checks
        run: python3 ../../scripts/release_readiness.py apps/lelu-oware
      - name: Upload to App Store Connect
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review || 'false' }}
        run: BUNDLE_GEMFILE=$GITHUB_WORKSPACE/Gemfile bundle exec fastlane ios release
      - name: Tag the release and publish its notes
        # A run from the Actions tab has no tag yet; a published GitHub Release already has one.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ../../scripts/next_version.py --notes > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Lelu Oware $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          # Refresh the public What's new page: a release created with GITHUB_TOKEN fires no `release` event.
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
