name: App Store Release

# Ships a build you have already tested on TestFlight. Nothing is rebuilt.
#   Actions ▸ App Store Release ▸ Run workflow ▸ "Use workflow from" ▸ Tags ▸ build/X.Y.Z ▸ Run.
# Every TestFlight upload is tagged build/<version>, its build number in the tag's message (see
# testflight.yml). This run:
#   1. sends that build to App Review with "What's New" written from the PR titles,
#   2. has Apple release it to everyone as soon as it is approved,
#   3. tags vX.Y.Z, publishes the GitHub Release "Lelu Oware X.Y.Z" and refreshes the What's new page.
# One version can be in review at a time. If Apple rejects it, merge the fix and run this again on
# the newer build tag; App Store Connect's version number is updated to match.
# The App Store text, screenshots, privacy answers and age rating stay as set in App Store Connect.
on:
  workflow_dispatch:
    inputs:
      whats_new:
        description: "What's New on the App Store, if not the one written from the PR titles (leave empty to use those)"
        required: false
        default: ""

run-name: App Store ${{ github.ref_name }}

permissions:
  contents: write   # to tag the release
  actions: write    # to start the Pages workflow (a release made with GITHUB_TOKEN fires no `release` event)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Submit a TestFlight build for App Review
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/lelu-oware
    environment: production   # add required reviewers on this environment for a manual gate
    if: ${{ vars.SIGNING_READY == 'true' }}
    steps:
      - name: Read the version and build number from the tag
        working-directory: .
        env:
          REF: ${{ github.ref }}
        run: |
          # build/X.Y.Z, or the older build/X.Y.Z-<build number>.
          if [[ ! "$REF" =~ ^refs/tags/build/([0-9]+\.[0-9]+\.[0-9]+)(-([0-9]+))?$ ]]; then
            echo "::error::Run this from a build tag (Use workflow from ▸ Tags ▸ build/X.Y.Z), not $REF. Each TestFlight upload makes one."
            exit 1
          fi
          echo "APP_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BASH_REMATCH[3]}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: The build number, from the tag's message if not in its name
        run: |
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="$(git tag --list --format='%(contents:subject)' "${GITHUB_REF#refs/tags/}" | sed -n 's/^build \([0-9][0-9]*\)$/\1/p')"
            if [ -z "$BUILD_NUMBER" ]; then
              echo "::error::${GITHUB_REF#refs/tags/} has no build number in its message (\"build NNNN\")."
              exit 1
            fi
            echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          fi
          echo "Releasing version $APP_VERSION, build $BUILD_NUMBER"
      - name: Not already released
        run: |
          if git rev-parse -q --verify "refs/tags/v$APP_VERSION" >/dev/null; then
            echo "::error::v$APP_VERSION is already released. Pick a newer build tag."
            exit 1
          fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: App Store readiness checks
        run: python3 ../../scripts/release_readiness.py apps/lelu-oware
      - name: Write the release notes
        env:
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          # What's New on the App Store: none for the very first version (Apple has no field for it).
          if [ -n "$WHATS_NEW" ] && [ -n "$(git tag --list 'v*')" ]; then
            { echo "RELEASE_NOTES<<EOF_NOTES"; echo "$WHATS_NEW"; echo "EOF_NOTES"; } >> "$GITHUB_ENV"
          elif [ -n "$(git tag --list 'v*')" ]; then
            { echo "RELEASE_NOTES<<EOF_NOTES"; python3 ../../scripts/next_version.py --store-notes; echo "EOF_NOTES"; } >> "$GITHUB_ENV"
          fi
          python3 ../../scripts/next_version.py --notes > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Submit for App Review (released automatically once approved)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: BUNDLE_GEMFILE=$GITHUB_WORKSPACE/Gemfile bundle exec fastlane ios release
      - name: Tag the release and publish its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" --target "$GITHUB_SHA" --title "Lelu Oware $APP_VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          # Refresh the public What's new page: a release created with GITHUB_TOKEN fires no `release` event.
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
          echo "Submitted $APP_VERSION ($BUILD_NUMBER) for review; it goes live when Apple approves it." >> "$GITHUB_STEP_SUMMARY"
