# XcodeGen spec for Lelu Ludo — run `make project` here to produce LeluLudo.xcodeproj (not committed).
name: LeluLudo
options:
  bundleIdPrefix: com.richardforjoe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  LudoEngine:
    path: ../../packages/LudoEngine

targets:
  LeluLudo:
    type: application
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: LeluLudo/Sources
      - path: LeluLudo/Resources
    dependencies:
      - package: LudoEngine
        product: LudoEngine
      - package: LudoEngine
        product: LudoAI
    info:
      path: LeluLudo/Info.plist
      properties:
        CFBundleDisplayName: Lelu Ludo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.richardforjoe.leluludo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  LeluLudoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LeluLudoTests]
    dependencies:
      - target: LeluLudo
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""

  LeluLudoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LeluLudoUITests]
    dependencies:
      - target: LeluLudo
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  LeluLudo:
    build:
      targets:
        LeluLudo: all
        LeluLudoTests: [test]
        LeluLudoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets: [LeluLudoTests, LeluLudoUITests]
    archive:
      config: Release
