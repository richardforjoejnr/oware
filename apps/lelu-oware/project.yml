# XcodeGen spec — run `make project` (or `xcodegen generate`) in apps/lelu-oware to produce Oware.xcodeproj.
# The .xcodeproj is NOT committed; this file is the source of truth.
name: Oware
options:
  bundleIdPrefix: com.richardforjoe
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

attributes:
  LastUpgradeCheck: "2700"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    # Keep build numbers plain increasing integers: StoreKit reports the first-installed build,
    # which decides "founding player" status if anything is ever paid (see OnlineAccess.swift).
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    # TelemetryDeck app "Lelu Oware" (not a secret: it ships inside the app). Empty turns analytics off.
    TELEMETRYDECK_APP_ID: "2B02636D-AE8C-4D55-A14A-9FCDE1C25D74"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  OwareEngine:
    path: ../../packages/OwareEngine
  SupportKit:
    path: ../../packages/SupportKit
  # Anonymous analytics (see Oware/Sources/Support/Analytics.swift and docs/lelu-oware/privacy.md).
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.14.2

targets:
  Oware:
    type: application
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: Oware/Sources
      - path: Oware/Resources
    dependencies:
      - package: OwareEngine
        product: OwareEngine
      - package: OwareEngine
        product: OwareAI
      - package: SupportKit
        product: SupportKit
      - package: TelemetryDeck
        product: TelemetryDeck
      - sdk: GameKit.framework
    entitlements:
      path: Oware/Oware.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: Oware/Info.plist
      properties:
        CFBundleDisplayName: Lelu Oware
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Set TELEMETRYDECK_APP_ID (e.g. in CI or a local xcconfig); empty leaves analytics off.
        TelemetryDeckAppID: $(TELEMETRYDECK_APP_ID)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.richardforjoe.oware
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Automatic signing by default so Product ▸ Archive ▸ Distribute works straight from Xcode.
        # CI overrides these with manual match signing via xcargs in fastlane/Fastfile.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
  OwareTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OwareTests]
    dependencies:
      - target: Oware
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""

  OwareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OwareUITests]
    dependencies:
      - target: Oware
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  Oware:
    build:
      targets:
        Oware: all
        OwareTests: [test]
        OwareUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Oware/Resources/Tips.storekit
    test:
      config: Debug
      storeKitConfiguration: Oware/Resources/Tips.storekit
      gatherCoverageData: true
      targets: [OwareTests, OwareUITests]
    archive:
      config: Release
